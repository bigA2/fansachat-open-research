# Public research, no AI tokens: O*NET persona teams -> Laya automation scores; Crawl4AI autofix docs.
name: research
on: { workflow_dispatch: {}, push: { branches: [main], paths: ['scripts/**', '.github/workflows/research.yml'] } }
permissions: { contents: write }
jobs:
  teams:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python scripts/build_teams.py
      - run: pip install -q laya==0.3.22 --extra-index-url https://download.pytorch.org/whl/cpu
      - run: python scripts/laya_score.py
      - uses: actions/upload-artifact@v4
        with: { name: teams, path: results/ }
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q crawl4ai && crawl4ai-setup
      - run: python scripts/crawl_autofix.py
      - uses: actions/upload-artifact@v4
        with: { name: autofix, path: results/ }
  commit:
    needs: [teams, autofix]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dl }
      - run: |
          mkdir -p results && cp -r dl/teams/* results/ 2>/dev/null || true; cp -r dl/autofix/* results/ 2>/dev/null || true
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results && git commit -m "Research results (O*NET teams, Laya scores, autofix docs) [skip ci]" && git push || echo nothing
